<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>zhizhu</title>
<meta name="description" content="A reader over the zhizhu article archive.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f7cff'/%3E%3Cpath d='M32 12v40M12 32h40M18 18l28 28M46 18 18 46' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23fff'/%3E%3C/svg%3E">
<script>
try {
  var t = localStorage.getItem('zhizhu.theme') ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = t;
} catch (err) {
  console.warn('Could not restore the saved theme.', err);
}

</script>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="app">

  <aside id="sidebar">
    <div class="wordmark">
      <svg class="wordmark-icon" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="var(--accent)"/><path d="M32 12v40M12 32h40M18 18l28 28M46 18 18 46" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="32" cy="32" r="7" fill="#fff"/></svg>
      <span>zhizhu</span>
    </div>
    <nav id="nav" aria-label="Publishers"></nav>
    <div class="sidebar-footer">
      <button id="sync-btn" class="icon-btn" title="Sync" aria-label="Sync">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21v-5h5"/></svg>
      </button>
      <button id="theme-toggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.4"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3L17 7M7 17l-1.7 1.7"/></svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 14.2A8.5 8.5 0 0 1 9.8 3.6a8.5 8.5 0 1 0 10.6 10.6Z"/></svg>
      </button>
      <button id="help-btn" class="icon-btn" title="Keyboard shortcuts" aria-label="Keyboard shortcuts">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8"/></svg>
      </button>
    </div>
  </aside>

  <section id="timeline">
    <button id="menu-btn" class="icon-btn timeline-menu-btn" title="Publishers" aria-label="Show publishers">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9.5 4v16"/></svg>
    </button>
    <div id="cards" role="list"></div>
    <div id="timeline-status" role="status" aria-live="polite" hidden></div>
  </section>

  <article id="reader">
    <header class="pane-header reader-toolbar">
      <button id="back-btn" class="icon-btn" title="Back" aria-label="Back to list">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
      </button>
    </header>
    <div id="reader-scroll">
      <div id="article" hidden></div>
      <div id="reader-empty">
        <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 12v40M12 32h40M18 18l28 28M46 18 18 46" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="32" cy="32" r="7"/></svg>
        <p>No article selected</p>
        <p class="hint">Pick something from the timeline — or use <kbd>j</kbd>/<kbd>k</kbd> to move around.</p>
      </div>
    </div>
  </article>

</div>
<div id="scrim"></div>

<dialog id="search-dialog" aria-labelledby="search-label">
  <div class="search-box">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20.5 20.5-4.9-4.9"/></svg>
    <label id="search-label" class="visually-hidden" for="search">Search articles</label>
    <input id="search" type="search" autocomplete="off" spellcheck="false" aria-describedby="search-hint">
    <kbd>esc</kbd>
  </div>
  <div id="search-hint" class="search-hint" aria-live="polite"></div>
</dialog>

<div id="publisher-popover" class="publisher-popover" role="dialog" aria-label="Publisher details" hidden>
  <div class="publisher-popover-head">
    <div id="publisher-popover-icon"></div>
    <div class="publisher-popover-title-wrap">
      <strong id="publisher-popover-name"></strong>
      <span id="publisher-popover-stats"></span>
    </div>
  </div>
  <div class="publisher-feed-label">RSS feed</div>
  <div class="publisher-feed-url">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11a8 8 0 0 1 8 8"/><path d="M5 5a14 14 0 0 1 14 14"/><circle cx="5" cy="19" r="1"/></svg>
    <span id="publisher-popover-url"></span>
  </div>
  <button id="copy-rss-btn" class="copy-rss-btn" type="button">
    <svg class="icon copy-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
    <svg class="icon check-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
    <span>Copy RSS URL</span>
  </button>
</div>

<dialog id="help">
  <h2>Keyboard</h2>
  <dl>
    <dt><kbd>j</kbd> / <kbd>↓</kbd></dt><dd>Next article</dd>
    <dt><kbd>k</kbd> / <kbd>↑</kbd></dt><dd>Previous article</dd>
    <dt><kbd>f</kbd></dt><dd>Toggle focus reading</dd>
    <dt><kbd>Enter</kbd></dt><dd>Open the selected article</dd>
    <dt><kbd>o</kbd></dt><dd>Open the original page</dd>
    <dt><kbd>s</kbd></dt><dd>Star</dd>
    <dt><kbd>u</kbd></dt><dd>Mark unread</dd>
    <dt><kbd>⌘</kbd> <kbd>K</kbd></dt><dd>Search</dd>
    <dt><kbd>Esc</kbd></dt><dd>Back to the list</dd>
  </dl>
  <form method="dialog"><button class="btn">Close</button></form>
</dialog>

<script src="assets/app.js"></script>
</body>
</html>
