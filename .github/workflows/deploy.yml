name: Deploy Pages

# Redeploys whenever anything lands on main. Content no longer arrives this way:
# the reader fetches the feeds, so a deploy is only ever a change to the app or
# to feeds.opml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Stage site
        run: |
          mkdir -p _site
          cp -R index.html manifest.json sw.js feeds.opml assets _site/
          # The bundle is dead weight the reader no longer reads, kept published
          # only as a fallback while the feed path proves itself. Drop this line
          # and the directory together.
          [ -d data ] && cp -R data _site/ || true
          touch _site/.nojekyll

      # sw.js serves the core assets stale-while-revalidate and its activate
      # handler only evicts caches under a *different* name, so the key has to
      # move whenever those assets do. Deriving it here rather than in a local
      # Justfile means it is right however the commit was pushed. sw.js itself is
      # part of the input, with its own CACHE_NAME line stripped, so a change to
      # the caching logic busts the cache too.
      #
      # feeds.opml is in the hash because it is app state rather than content:
      # adding a publisher has to reach every reader, and it reaches them by the
      # cache key moving.
      - name: Stamp service worker cache key
        run: |
          key="zhizhu-cache-$(cat _site/index.html _site/assets/app.js _site/assets/style.css \
            _site/feeds.opml <(sed '/^const CACHE_NAME/d' _site/sw.js) | sha256sum | cut -c1-8)"
          sed -i "s|^const CACHE_NAME = '.*';|const CACHE_NAME = '$key';|" _site/sw.js
          echo "zhizhu: service worker cache key $key"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
